[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-profitability-analysis-model"
version = "0.1.0"
description = "A sanitized customer and product profitability portfolio project"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "pandas>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
